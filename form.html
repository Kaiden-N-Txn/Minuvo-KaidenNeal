<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="form.css">
    <img src="Screenshot 2026-07-27 at 1.14.37 PM.png" class="logo">
    
   <div class="signup-card">

    <h1>Create Your Account</h1>

    <p>
        Start turning your free time into something meaningful.
    </p>


    <label for="email">
        Email
    </label>

    <input 
    type="text" 
    placeholder="Enter Email" 
    name="email" 
    required>


    <label for="psw">
        Password
    </label>

    <input 
    type="password" 
    placeholder="Enter Password" 
    name="psw" 
    required>


    <label for="psw-repeat">
        Repeat Password
    </label>

    <input 
    type="password" 
    placeholder="Repeat Password" 
    name="psw-repeat" 
    required>


    <label class="remember">

        <input 
        type="checkbox" 
        name="remember">

        Remember me

    </label>


    <p class="terms">

        By creating an account you agree to our

        <a href="#">
            Terms & Privacy
        </a>

    </p>


    <div class="buttons">

        <button 
        type="button" 
        class="cancelbtn">
            Cancel
        </button>


        <button 
        type="submit" 
        class="signupbtn">
            Create Account
        </button>

    </div>

</div>

</body>
</html>
