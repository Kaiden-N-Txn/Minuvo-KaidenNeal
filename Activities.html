<section class="activities">

    <h1>Find an Activity</h1>
    <p>Select how much free time you have and what you're interested in.</p>

    <label for="time">How much time do you have?</label>
    <select id="time">
        <option>15 Minutes</option>
        <option>30 Minutes</option>
        <option>1 Hour</option>
        <option>2 Hours</option>
    </select>

    <h3>Select an Interest</h3>

    <div class="buttons">
        <button onclick="chooseInterest('Learning')">Learning</button>
        <button onclick="chooseInterest('Health')">Health</button>
        <button onclick="chooseInterest('Creativity')">Creativity</button>
        <button onclick="chooseInterest('Career')">Career</button>
        <button onclick="chooseInterest('Social')">Social</button>
        <button onclick="chooseInterest('Relaxation')">Relaxation</button>
    </div>

    <br>

    <button class="generate" onclick="generateIdeas()">Generate Ideas</button>

    <h2>Activity Ideas</h2>
    <p id="result">Your activity will appear here.</p>

    
</section>
